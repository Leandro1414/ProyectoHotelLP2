spring.application.name=reservaHotel
server.port=${SERVER_PORT:8091}

# La contraseña no se guarda en GitHub. Defina DB_PASSWORD en el entorno local,
# en Spring Tool Suite o en el servicio donde despliegue la aplicación.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/LP2Final?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=America/Lima

spring.thymeleaf.cache=false
