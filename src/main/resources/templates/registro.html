<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Crear cuenta')}"></head>
<body class="auth-page">
<main class="card auth-card">
    <h1 class="auth-logo">CREAR CUENTA</h1>
    <p class="auth-subtitle">Registra un usuario recepcionista</p>

    <form th:action="@{/registro}" th:object="${registroForm}" method="post">
        <div class="form-error" th:if="${#fields.hasGlobalErrors()}" th:each="e : ${#fields.globalErrors()}" th:text="${e}"></div>
        <div class="form-group">
            <label for="nombre">Nombre</label>
            <input id="nombre" class="form-control" th:field="*{nombre}" required>
            <span class="field-error" th:errors="*{nombre}"></span>
        </div>
        <div class="form-group">
            <label for="apellido">Apellido</label>
            <input id="apellido" class="form-control" th:field="*{apellido}" required>
            <span class="field-error" th:errors="*{apellido}"></span>
        </div>
        <div class="form-group">
            <label for="correo">Correo</label>
            <input id="correo" class="form-control" type="email" th:field="*{correo}" required>
            <span class="field-error" th:errors="*{correo}"></span>
        </div>
        <div class="form-group">
            <label for="password">Contraseña</label>
            <input id="password" class="form-control" type="password" th:field="*{password}" required>
            <span class="field-error" th:errors="*{password}"></span>
            <span class="help">Mínimo 8 caracteres, con mayúscula, minúscula y número.</span>
        </div>
        <div class="form-group">
            <label for="confirmarPassword">Confirmar contraseña</label>
            <input id="confirmarPassword" class="form-control" type="password" th:field="*{confirmarPassword}" required>
            <span class="field-error" th:errors="*{confirmarPassword}"></span>
            <span class="field-error" th:errors="*{passwordCoincide}"></span>
        </div>
        <button class="btn btn-primary" type="submit">Crear cuenta</button>
    </form>
    <p class="auth-link">¿Ya tienes cuenta? <a th:href="@{/login}">Inicia sesión</a></p>
</main>
</body>
</html>
