<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Iniciar sesión')}"></head>
<body class="auth-page">
<main class="card auth-card">
    <h1 class="auth-logo">HOTEL EXCLUSIVE</h1>
    <p class="auth-subtitle">Acceso al sistema de reservas</p>

    <div class="alert alert-success" th:if="${exito}" th:text="${exito}"></div>
    <div class="alert alert-success" th:if="${param.logout}">Sesión cerrada correctamente.</div>
    <div class="alert alert-danger" th:if="${param.error}">Correo o contraseña incorrectos.</div>

    <form th:action="@{/login}" method="post">
        <div class="form-group">
            <label for="username">Correo</label>
            <input id="username" class="form-control" type="email" name="username" required autocomplete="username" autofocus>
        </div>
        <div class="form-group">
            <label for="password">Contraseña</label>
            <input id="password" class="form-control" type="password" name="password" required autocomplete="current-password">
        </div>
        <button class="btn btn-primary" type="submit">Ingresar</button>
    </form>

    <p class="auth-link">¿No tienes cuenta? <a th:href="@{/registro}">Regístrate</a></p>
    <div class="credentials">
        <strong>Cuenta inicial:</strong><br>
        admin@hotel.com · Admin123*
    </div>
</main>
</body>
</html>
