<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Clientes')}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<main class="container">
    <div th:replace="~{fragments/messages :: messages}"></div>
    <header class="page-header">
        <div><h1 class="page-title">Clientes</h1><p class="page-subtitle">Directorio de huéspedes y documentos.</p></div>
        <a class="btn btn-primary" th:href="@{/clientes/create}">+ Registrar cliente</a>
    </header>
    <section class="card">
        <form class="search-bar" method="get" th:action="@{/clientes}">
            <input class="form-control" type="search" name="q" th:value="${q}" placeholder="Buscar por nombre, DNI o RUC">
            <button class="btn btn-secondary" type="submit">Buscar</button>
            <a class="btn btn-secondary" th:if="${q}" th:href="@{/clientes}">Limpiar</a>
        </form>
        <div class="table-wrap">
            <table>
                <thead><tr><th>ID</th><th>Nombre</th><th>DNI/RUC</th><th>Teléfono</th><th>Dirección</th><th>Acciones</th></tr></thead>
                <tbody>
                <tr th:each="c : ${clientes}">
                    <td th:text="${c.idCliente}"></td>
                    <td th:text="${c.nombre}"></td>
                    <td th:text="${c.rucDni}"></td>
                    <td th:text="${c.telefono ?: '-'}"></td>
                    <td th:text="${c.direccion ?: '-'}"></td>
                    <td><div class="actions">
                        <a class="btn btn-secondary btn-sm" th:href="@{/clientes/edit/{id}(id=${c.idCliente})}">Editar</a>
                        <form class="inline-form" th:action="@{/clientes/delete/{id}(id=${c.idCliente})}" method="post">
                            <button class="btn btn-danger btn-sm" type="submit" data-confirm="¿Eliminar este cliente?">Eliminar</button>
                        </form>
                    </div></td>
                </tr>
                <tr th:if="${#lists.isEmpty(clientes)}"><td colspan="6" class="empty">No se encontraron clientes.</td></tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
<footer th:replace="~{fragments/footer :: footer}"></footer>
<th:block th:replace="~{fragments/scripts :: scripts}"></th:block>
</body>
</html>
