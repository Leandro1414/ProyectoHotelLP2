<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${cliente.idCliente == null ? 'Nuevo cliente' : 'Editar cliente'})}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<main class="container">
    <header class="page-header"><div><h1 class="page-title" th:text="${cliente.idCliente == null ? 'Nuevo cliente' : 'Editar cliente'}"></h1><p class="page-subtitle">Los datos se validan antes de guardarse.</p></div></header>
    <section class="card">
        <form class="form-grid" th:action="@{/clientes/save}" th:object="${cliente}" method="post">
            <input type="hidden" th:field="*{idCliente}">
            <div class="form-error full" th:if="${#fields.hasGlobalErrors()}" th:each="e : ${#fields.globalErrors()}" th:text="${e}"></div>
            <div class="form-group full"><label for="nombre">Nombre completo</label><input id="nombre" class="form-control" th:field="*{nombre}" maxlength="150" required><span class="field-error" th:errors="*{nombre}"></span></div>
            <div class="form-group"><label for="rucDni">DNI o RUC</label><input id="rucDni" class="form-control" th:field="*{rucDni}" inputmode="numeric" maxlength="11" required><span class="field-error" th:errors="*{rucDni}"></span></div>
            <div class="form-group"><label for="telefono">Teléfono</label><input id="telefono" class="form-control" th:field="*{telefono}" inputmode="numeric" maxlength="15"><span class="field-error" th:errors="*{telefono}"></span></div>
            <div class="form-group full"><label for="direccion">Dirección</label><input id="direccion" class="form-control" th:field="*{direccion}" maxlength="255"><span class="field-error" th:errors="*{direccion}"></span></div>
            <div class="form-actions"><a class="btn btn-secondary" th:href="@{/clientes}">Cancelar</a><button class="btn btn-primary" type="submit">Guardar cliente</button></div>
        </form>
    </section>
</main>
<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
